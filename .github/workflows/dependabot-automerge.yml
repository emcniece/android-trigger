name: Dependabot auto-merge

# Approves and enables auto-merge on Dependabot patch/minor PRs; the merge happens only
# after the required "Test" check passes (enforced by the "main" ruleset).
on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@v3

      # Major version bumps (e.g. AGP, Kotlin) often need code changes, so they are left for review.
      # The approval satisfies the ruleset's review requirement; the merge still waits for "Test".
      - name: Approve and enable auto-merge for patch and minor updates
        if: steps.meta.outputs.update-type != 'version-update:semver-major'
        run: |
          gh pr review --approve "$PR_URL" --body "Auto-approved: Dependabot ${{ steps.meta.outputs.update-type }}"
          gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
